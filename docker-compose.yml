services:
  postgres:
    image: postgres:16-alpine
    container_name: reactify-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: reactify
      POSTGRES_PASSWORD: reactify_dev
      POSTGRES_DB: reactify
    volumes:
      - reactify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactify -d reactify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reactify_postgres_data:
