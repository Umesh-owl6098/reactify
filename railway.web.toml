[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm --filter @reactify/web build"
watchPatterns = ["apps/web/**", "packages/**", "package.json", "pnpm-lock.yaml"]

[deploy]
startCommand = "corepack pnpm start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
