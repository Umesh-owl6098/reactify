[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm db:generate && corepack pnpm build"
watchPatterns = ["apps/api/**", "packages/**", "prisma/**", "package.json", "pnpm-lock.yaml"]

[deploy]
startCommand = "corepack pnpm start:api"
preDeployCommand = "corepack pnpm db:deploy"
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
